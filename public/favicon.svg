<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- PairFC favicon — simplified P+ball at 16-64px sizes -->
  <rect width="64" height="64" rx="12" fill="#10b981"/>
  
  <!-- P letter, simplified -->
  <path d="M 18 14 
           L 18 50 
           L 26 50 
           L 26 36 
           L 36 36
           C 44 36 50 30 50 25
           C 50 20 44 14 36 14
           Z 
           M 26 21
           L 36 21
           C 39 21 41 22 41 25
           C 41 28 39 29 36 29
           L 26 29
           Z" 
        fill="#ffffff"/>
  
  <!-- Small football in P counter -->
  <g transform="translate(27, 16)">
    <circle cx="6" cy="6" r="5.5" fill="#ffffff" stroke="#0f172a" stroke-width="0.8"/>
    <polygon points="6,3 8.5,4.5 7.5,7.5 4.5,7.5 3.5,4.5" fill="#0f172a"/>
  </g>
</svg>
